<!-- CATEGORY VIEW: PROPERTIES -->
<div class="h-full w-full rounded-[2rem] bg-white border border-slate-100 shadow-sm flex flex-col p-8 fade-in overflow-y-auto">
    <!-- View Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-8 relative">
        <div class="flex items-center gap-4 relative z-10">
            <div class="w-12 h-12 rounded-2xl bg-[var(--primary-container)] text-[var(--primary)] flex items-center justify-center text-xl shadow-sm border border-[var(--primary)]/20 shrink-0">
                <i class="fa-solid fa-house"></i>
            </div>
            <div>
                <h2 class="text-xl font-black text-slate-800 tracking-tight">Real Estate Properties</h2>
                <p class="text-xs font-medium text-slate-500 mt-1">Information regarding owned properties, cadastral references and assessment values.</p>
            </div>
        </div>
        
        <!-- Abstract Decoration -->
        <div class="absolute right-0 top-0 text-8xl text-slate-100/40 pointer-events-none -translate-y-4 translate-x-4">
            <i class="fa-solid fa-map-location-dot"></i>
        </div>
    </div>

    <!-- Properties Section -->
    <div class="flex flex-col gap-6 flex-1">
        <div id="properties-wrapper" class="flex flex-col gap-4">
            <div id="propertiesList" class="flex flex-col gap-6">
                <!-- JS Injection -->
                <div class="p-6 text-center text-slate-400 text-sm italic border border-slate-200 border-dashed rounded-xl" id="properties-empty">Loading properties data...</div>
            </div>
        </div>
    </div>
</div>
