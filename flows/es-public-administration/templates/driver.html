<!-- CATEGORY VIEW: DRIVER DATA -->
<div class="h-full w-full rounded-3xl bg-white border border-slate-100 shadow-sm flex flex-col p-8 fade-in">
    
    <!-- View Header -->
    <div class="flex items-center gap-4 mb-8">
        <div class="w-12 h-12 rounded-2xl bg-[var(--primary-container)] text-[var(--primary)] flex items-center justify-center text-xl shadow-sm border border-[var(--primary)]/20">
            <i class="fa-solid fa-car"></i>
        </div>
        <div>
            <h2 class="text-xl font-black text-slate-800 tracking-tight">Driver Data</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">DGT vehicle ownership and driving license status.</p>
        </div>
    </div>

    <!-- Driver Status Summary Card -->
    <div class="w-full rounded-3xl bg-[#f8fafc] border border-slate-200/60 p-5 sm:p-6 lg:p-8 flex flex-col relative overflow-hidden mb-8">
        <!-- Abstract Decoration -->
        <div class="absolute -right-16 -top-16 w-64 h-64 bg-slate-200/40 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -left-6 -bottom-6 text-9xl text-[140px] text-slate-200/50 pointer-events-none">
            <i class="fa-solid fa-car"></i>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center relative z-10 w-full">

            <!-- LEFT: the person — photograph, document and name -->
            <div class="flex items-center gap-4 sm:gap-5 flex-1 min-w-0 pr-0 sm:pr-8">
                <!-- The DGT's photograph when the connection brings one; a neutral frame otherwise -->
                <div class="w-20 h-24 sm:w-24 sm:h-28 rounded-2xl bg-white border border-slate-200 shadow-sm overflow-hidden shrink-0 flex items-center justify-center">
                    <img id="driverPhoto" class="hidden w-full h-full object-cover" alt="Driver photograph">
                    <div id="driverPhotoPlaceholder" class="flex flex-col items-center justify-center gap-1.5 text-slate-300">
                        <i class="fa-solid fa-user text-3xl"></i>
                        <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">No photo</span>
                    </div>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight leading-none" id="lblDriverIdValue">------</span>
                    <span class="text-sm font-bold text-slate-600 mt-1.5 truncate" id="lblDriverName">--</span>
                </div>
            </div>

            <!-- DIVIDER -->
            <div class="w-full h-px sm:w-px sm:self-stretch bg-slate-200/60 my-6 sm:my-0"></div>

            <!-- RIGHT: Points -->
            <div class="flex items-center gap-4 shrink-0 pl-0 sm:pl-8 sm:flex-row-reverse">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white border border-slate-200 flex flex-col items-center justify-center shadow-sm">
                    <i class="fa-solid fa-gauge-high text-xl sm:text-2xl text-slate-300" id="driverStatusIcon"></i>
                </div>
                <div class="flex flex-col text-left sm:text-right pt-1">
                    <h3 class="text-4xl sm:text-5xl font-black text-slate-800 tracking-tight leading-none" id="lblPointBalance">--</h3>
                    <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase mt-1">Point Balance</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Licences and special authorizations: one quiet line under the header -->
    <div class="flex flex-wrap items-center gap-x-6 gap-y-3 px-1 mb-8">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 min-w-0">
            <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase flex items-center gap-1.5">
                <i class="fa-solid fa-id-card"></i> Licences
            </span>
            <div id="driverLicencesList" class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs text-slate-400 italic">Loading...</span>
            </div>
        </div>
        <!-- Hidden when the connection does not report them (null): absent is not the same as "no" -->
        <div id="specialAuthContainer" class="hidden flex flex-wrap items-center gap-x-3 gap-y-2 sm:ml-auto">
            <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved"></i> Authorizations
            </span>
            <div id="specialAuthList" class="flex flex-wrap items-center gap-1.5"></div>
        </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="flex items-center gap-2 mb-6 p-1.5 bg-slate-100/50 rounded-xl w-fit border border-slate-200/50">
        <button id="btnTabVehicles" onclick="switchDriverTab('vehicles')" class="px-5 py-2 rounded-lg text-xs font-bold transition-all bg-white text-slate-800 shadow-sm flex items-center gap-2 flex-wrap">
            <i class="fa-solid fa-truck-pickup"></i>
            <span>Vehicles</span>
        </button>
        <!-- Point Movements is temporarily disabled: see DRIVER_POINTS_TAB_DISABLED in the results page -->
        <button id="btnTabPoints" onclick="switchDriverTab('points')" disabled aria-disabled="true" title="Temporarily unavailable" class="px-5 py-2 rounded-lg text-xs font-bold transition-all text-slate-300 cursor-not-allowed flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Point Movements</span>
        </button>
    </div>

    <!-- MAIN SCROLLABLE AREA -->
    <div class="flex-1 overflow-y-auto custom-scrollbar -mr-4 pr-4">
        
        <!-- ======================= -->
        <!-- TAB 1: POINT MOVEMENTS  -->
        <!-- ======================= -->
        <div id="containerDriverPoints" class="hidden flex-col gap-4 pb-8">
            <h3 class="text-sm font-bold text-slate-700 tracking-tight mb-2 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-slate-400"></i> Balance History
            </h3>

            <!-- Transactions List Header -->
            <div class="flex items-center justify-between px-4 py-2 bg-slate-50 rounded-lg border border-slate-200 mb-2">
                <div class="flex-1 min-w-0 pr-4">
                    <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Movement Detail</span>
                </div>
                <div class="w-32 text-right shrink-0">
                    <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Delta / After</span>
                </div>
            </div>

            <div id="pointsList" class="flex flex-col gap-2 relative">
                 <!-- Data will be injected here via JS -->
                 <div class="p-6 text-center text-slate-400 text-sm italic">Loading movements...</div>
            </div>
        </div>

        <!-- ======================= -->
        <!-- TAB 2: VEHICLES         -->
        <!-- ======================= -->
        <div id="containerDriverVehicles" class="flex flex-col gap-4 pb-8">
            <h3 class="text-sm font-bold text-slate-700 tracking-tight mb-2 flex items-center gap-2">
                <i class="fa-solid fa-car text-slate-400"></i> Registered Vehicles
            </h3>
            
            <div id="vehiclesGrid" class="grid grid-cols-1 gap-4">
                 <div class="p-6 text-center text-slate-400 text-sm italic border border-dashed rounded-xl border-slate-200">No vehicles registered.</div>
            </div>
        </div>

    </div>
</div>
