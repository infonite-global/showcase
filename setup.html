<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Environment Setup - Infonite</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
      :root {
        --primary: #00a76f;
        --primary-rgb: 0, 167, 111;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
      }
      .fade-in { animation: fadeIn 0.4s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }
      
      .bounce-spin {
          animation: bounceSpin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      @keyframes bounceSpin {
          0% { transform: rotate(0deg) scale(0.8); }
          50% { transform: rotate(180deg) scale(1.1); }
          100% { transform: rotate(360deg) scale(0.8); }
      }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Decorators -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-[rgba(var(--primary-rgb),0.03)] blur-[120px]"></div>
        <div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-500/5 blur-[100px]"></div>
        
        <!-- Grid Pattern overlay -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGRlZnM+PG1hc2sgaWQ9Im0iPjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0iI2ZmZiIvPjwvbWFzaz48L2RlZnM+PGcgbWFzaz0idXJsKCNtKSI+PHBhdGggZD0iTTAgMGg0MHY0MEgwem0zOSAzOVYxaC0zOHYzOHoiIGZpbGw9IiMwMDAiIGZpbGwtb3BhY2l0eT0iMC4wMiIvPjwvZz48L3N2Zz4=')] opacity-50 mix-blend-multiply"></div>
    </div>

    <div class="w-full max-w-md glass-card rounded-3xl p-8 relative z-10 flex flex-col items-center text-center fade-in">
        
        <!-- View: Loading -->
        <div id="view-loading" class="flex flex-col items-center justify-center w-full py-6">
            <div class="w-16 h-16 rounded-2xl bg-[rgba(var(--primary-rgb),0.1)] flex items-center justify-center mb-6">
                <i class="fa-solid fa-arrows-rotate text-2xl text-[var(--primary)] bounce-spin"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Importing Environment</h2>
            <p class="text-sm font-medium text-slate-500">Synchronizing app configurations securely...</p>
        </div>

        <!-- View: Success -->
        <div id="view-success" class="flex flex-col items-center justify-center w-full py-4 hidden">
            <div class="w-16 h-16 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center mb-6">
                <i class="fa-solid fa-check text-3xl text-emerald-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Ready to go!</h2>
            <p class="text-sm font-medium text-slate-500 mb-6">The environment has been configured successfully. You will be redirected in <span id="timerText" class="font-bold text-slate-900">3</span>s...</p>
            <button onclick="window.location.href='index.html'" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold uppercase tracking-widest transition-colors shadow-lg">
                Go to Dashboard
            </button>
        </div>

        <!-- View: Warning / Conflict -->
        <div id="view-warning" class="flex flex-col items-center justify-center w-full py-4 hidden">
            <div class="w-16 h-16 rounded-2xl bg-amber-50 border border-amber-100 flex items-center justify-center mb-6">
                <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Already Existing</h2>
            <p class="text-sm font-medium text-slate-500 mb-6" id="warning-msg">This environment is already registered in your browser.</p>
            <button onclick="window.location.href='index.html'" class="w-full py-3 border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold uppercase tracking-widest transition-colors">
                Return to Dashboard
            </button>
        </div>

        <!-- View: Error -->
        <div id="view-error" class="flex flex-col items-center justify-center w-full py-4 hidden">
            <div class="w-16 h-16 rounded-2xl bg-red-50 border border-red-100 flex items-center justify-center mb-6">
                <i class="fa-solid fa-xmark text-4xl text-red-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Setup Failed</h2>
            <p class="text-sm font-medium text-slate-500 mb-6 overflow-hidden text-ellipsis w-full px-2" id="error-msg">Invalid configuration URL.</p>
            <button onclick="window.location.href='index.html'" class="w-full py-3 border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold uppercase tracking-widest transition-colors">
                Return to Dashboard
            </button>
        </div>
        
    </div>

    <!-- Load Config Manager -->
    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            function showView(id) {
                ['view-loading', 'view-success', 'view-warning', 'view-error'].forEach(v => {
                    document.getElementById(v).classList.add('hidden');
                });
                document.getElementById(id).classList.remove('hidden');
                document.getElementById(id).classList.add('fade-in');
            }

            try {
                // 1. Parse URL Payload
                const urlParams = new URLSearchParams(window.location.search);
                const encodedPayload = urlParams.get('c');
                
                if (!encodedPayload) {
                    throw new Error("No configuration payload provided in the URL.");
                }

                const decodedString = atob(encodedPayload);
                const payload = JSON.parse(decodedString);
                
                // Validate Minimum Required Fields (secret and widgetUrl)
                if (!payload.s || !payload.u) {
                    throw new Error("Payload is missing required authentication parameters.");
                }

                // 2. Hydrate Temporary Config Object
                const tempConfig = {
                    ...InfoniteConfigManager.DEFAULT_CONFIG_ITEM,
                    id: crypto.randomUUID(),
                    secret: payload.s,
                    widgetUrl: payload.u,
                    hostType: payload.ht || 'production',
                    saturateLogo: payload.hasOwnProperty('sl') ? payload.sl : true,
                    bannerColor: payload.bc || '#1C252E',
                    bannerColorScheme: payload.bs || 'dark',
                    isMock: false
                };
                
                // Apply visual theme to loading screen if banner color exists
                if(payload.bc) {
                    document.documentElement.style.setProperty('--primary', payload.bc);
                }

                // 3. Verify Against Remote (Fetch Real AppId & Details)
                const verifyRes = await fetch(`${tempConfig.widgetUrl}/api/app`, {
                    method: 'GET',
                    headers: { 'X-APP-SECRET': tempConfig.secret }
                });

                if (!verifyRes.ok) {
                    throw new Error(`Authentication refused the connection. (HTTP ${verifyRes.status})`);
                }

                const appData = await verifyRes.json();
                const realAppId = appData.id;
                
                if(!realAppId) {
                    throw new Error("Failed to resolve a valid App ID from the Remote Widget Server.");
                }

                // 4. Check for Collisions in Local Storage
                const storageConfig = InfoniteConfigManager.getStorageData();
                const existingApp = storageConfig.list.find(c => c.appId === realAppId && c.widgetUrl === tempConfig.widgetUrl && !c.isMock);

                if (existingApp) {
                    // Update error text if it was a conflict
                    document.getElementById('warning-msg').textContent = `The environment "${existingApp.name || existingApp.appName}" is already registered.`;
                    showView('view-warning');
                    return;
                }

                // 5. Commit to Local Storage and Run Syncs
                tempConfig.appId = realAppId;
                tempConfig.appName = appData.display_name || "";
                
                let prefix = "[CSM]";
                if(tempConfig.hostType === "production") prefix = "[PRO]";
                if(tempConfig.hostType === "develop") prefix = "[DEV]";
                tempConfig.name = tempConfig.appName ? `${prefix} ${tempConfig.appName}` : "Unknown App";
                
                // Save it first so sync logic can find it inside storage
                storageConfig.list.push(tempConfig);
                storageConfig.activeId = tempConfig.id;
                InfoniteConfigManager.saveStorageData(storageConfig);

                // Run heavy syncs in parallel (App Settings and Logos)
                await Promise.all([
                    InfoniteConfigManager.syncAppSettings(tempConfig, false),
                    InfoniteConfigManager.syncAppLogos(tempConfig)
                ]);

                // 6. Complete
                showView('view-success');
                
                // Redirect timer
                let timeLeft = 3;
                const timerEl = document.getElementById('timerText');
                const interval = setInterval(() => {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    if(timeLeft <= 0) {
                        clearInterval(interval);
                        window.location.href = 'index.html';
                    }
                }, 1000);

            } catch (err) {
                console.error("Setup Parse Error:", err);
                const errorMsgEl = document.getElementById('error-msg');
                if(err.message.includes('atob')) {
                    errorMsgEl.textContent = "The setup link is corrupt or malformed.";
                } else {
                    errorMsgEl.textContent = err.message || "An unknown error occurred during setup.";
                }
                showView('view-error');
            }
        });
    </script>
</body>
</html>
