                />
            </g>
            <g id="pathT" transform="translate(190 0)">
                <!--            +25-->
                <circle cx="109.8" cy="96.3" r="8.2" fill="#000" filter="url(#cg-dot-shadow)"/>
                <path
                        class="cg-logo-color-base"
                        d="M106.36348,113.47355v9.77844c-6.89941,0-17.72852-1.4552-17.72852-13.25342V98.49418H84.9167V88.10294 h3.71826V77.92912h11.78369v30.0022C100.41866,109.95036,101.51387,113.47355,106.36348,113.47355z"
                />
                <path
                        class="cg-logo-color-emphasis"
                        d="M102.66182,94.82755c0-3.72119,2.92334-6.73901,6.53027-6.73901c3.60596,0,6.5293,3.01782,6.5293,6.73901 c0,3.72205-2.92334,6.73914-6.5293,6.73914C105.58516,101.56669,102.66182,98.5496,102.66182,94.82755z"
                />
            </g>
            <g id="path9385" transform="translate(225 0)">
                <!--            +35-->
                <path
                        class="cg-logo-color-base"
                        d="M106.71529,109.6724h11.26465c0,11.86011-12.58813,13.56531-17.79419,13.56531 s-18.47314-3.2511-18.47314-18.02246s11.45825-18.36951,18.34863-18.36951c10.64673,0,15.6311,5.49048,17.28784,13.28149 c0.4646,2.16309,0.67261,4.4989,0.67261,6.93848H93.48994c0,5.55249,2.90405,7.72925,7.08398,7.72925 C104.75313,114.79496,106.71529,112.44535,106.71529,109.6724z M93.7729,100.12724h13.20532l-0.07642-0.04822 c0-2.49573-1.88501-5.50415-6.52222-5.50415C95.74947,94.57487,93.77364,97.88859,93.7729,100.12724z"
                />
            </g>
        </g>
    </g>
</svg>
